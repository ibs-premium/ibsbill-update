<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simulate MTN MoMo Callback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow p-4">
      <h4 class="mb-3 text-center">Simulate MTN MoMo Callback</h4>

      <div class="mb-3">
        <label for="callbackUrl" class="form-label">Callback URL</label>
        <input type="text" class="form-control" id="callbackUrl" value="https://www.ibsbill.org/bill/callback/">
      </div>

      <div class="mb-3">
        <label class="form-label">Callback Payload</label>
        <textarea class="form-control" id="payload" rows="10">{
            "amount": "1.00",
            "currency": "GHS",
            "externalId": "829f2ffe-1a98-40eb-86e4-fa121dba136f",
            "payer": {
                "partyIdType": "MSISDN",
                "partyId": "233241234567"
            },
            "status": "SUCCESSFUL",
            "financialTransactionId": "tx-87654321",
            "reason": null
}</textarea>
      </div>

      <div class="d-grid gap-2">
        <button class="btn btn-primary" id="sendCallback">Send Callback</button>
      </div>

      <div class="mt-3" id="resultArea"></div>
    </div>
  </div>

  <script>
    $('#sendCallback').click(function () {
      const url = $('#callbackUrl').val();
      let data;

      try {
        data = JSON.parse($('#payload').val());
      } catch (e) {
        $('#resultArea').html('<div class="alert alert-danger">Invalid JSON payload!</div>');
        return;
      }

      $.ajax({
        url: url,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function (response) {
          $('#resultArea').html('<div class="alert alert-success">Callback sent successfully! Response:<br>' + JSON.stringify(response) + '</div>');
        },
        error: function (xhr) {
          $('#resultArea').html('<div class="alert alert-danger">Error: ' + xhr.status + ' - ' + xhr.statusText + '<br>' + xhr.responseText + '</div>');
        }
      });
    });
  </script>

</body>
</html>
