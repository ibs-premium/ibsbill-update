<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoMo Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
  .blinking-dots span {
      animation: blink 1s infinite;
  }

  .blinking-dots span:nth-child(2) {
      animation-delay: 0.2s;
  }

  .blinking-dots span:nth-child(3) {
      animation-delay: 0.4s;
  }

  @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
  }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  
</head>
<body class="bg-light">

  <div class="container py-5 d-flex justify-content-center align-items-center">
    <div class="card p-4 shadow-sm text-center" style="max-width: 400px;">
      <h4 class="mb-3">MoMo Payment</h4>
      <p class="text-muted">Click to send a MoMo transaction request.</p>
      <button id="sendPayment" class="btn btn-primary px-4">Send Payment</button>
      <div id="response" class="mt-3"></div>
      <div id="statusCheckResponse" class="mt-3"></div>
      <div id="pollingStatus" class="mt-3"></div>
    </div>
  </div>

<script>
// CSRF cookie handling — from Django docs
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

const csrftoken = getCookie('csrftoken');

// Automatically add CSRF token to all POST requests
$.ajaxSetup({
  beforeSend: function(xhr, settings) {
    if (!(/^GET|HEAD|OPTIONS|TRACE$/i.test(settings.type)) && !this.crossDomain) {
      xhr.setRequestHeader("X-CSRFToken", csrftoken);
    }
  }
});

let statusCheckInterval; // Variable to hold the setInterval ID

function stopPolling(message = "") {
    if (statusCheckInterval) {
        clearInterval(statusCheckInterval);
        statusCheckInterval = null;
        $('#pollingStatus').html(`<div class="alert alert-info">${message}</div>`);
    }
}

function startPolling(referenceId, apiToken) {
    const checkStatus = () => {
        $('#pollingStatus').html('Checking transaction status<span class="blinking-dots"><span>.</span><span>.</span><span>.</span></span>');
        $.ajax({
            url: "/momo/check_status/", // Ensure this is your correct endpoint for checking status
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                ref_id: referenceId,
                token: apiToken
            }),
            success: function (statusResponse) {
                const paymentStatus = statusResponse.momo_status_check?.payment_status;

                let displayMessage;
                let alertClass = 'alert-primary'; // Default class

                if (paymentStatus === "SUCCESSFUL") {
                    displayMessage = "Transaction Completed Successfully!";
                    alertClass = 'alert-success';
                    stopPolling("Polling stopped.");
                } else if (paymentStatus === "FAILED") {
                    displayMessage = "Transaction Failed.";
                    alertClass = 'alert-danger';
                    stopPolling("Polling stopped.");
                } else if (paymentStatus === "PENDING") {
                    displayMessage = "Waiting for approval<span class='blinking-dots'><span>.</span><span>.</span><span>.</span></span>";
                    alertClass = 'alert-warning';
                    $('#pollingStatus').html(`<div class="alert alert-info">Status is PENDING. Will check again in 20 seconds.</div>`); // Keep this specific message
                } else {
                    displayMessage = "Transaction status is unknown. Please contact support.";
                    alertClass = 'alert-secondary';
                    stopPolling("Unexpected status. Polling stopped.");
                }
                
                $('#statusCheckResponse').html(`<div class="${alertClass}">${displayMessage}</div>`);

                // // Optional: Uncomment if you still want to see the full JSON for debugging purposes, but it's commented out by default now
                // $('#statusCheckResponse').append(`<pre style="text-align: left; background-color: #f8f9fa; padding: 10px; border-radius: 5px; margin-top: 10px;">${JSON.stringify(statusResponse, null, 2)}</pre>`);
            },
            error: function (xhrStatus) {
                let errorMessage = xhrStatus.responseText || "Unknown error during status check";
                $('#statusCheckResponse').html(`<div class="alert alert-danger">Could not check transaction status. Please try again later or contact support.</div>`);
                // // Optional: Uncomment to show raw error for debugging
                // $('#statusCheckResponse').append(`<pre style="text-align: left; background-color: #f8f9fa; padding: 10px; border-radius: 5px; margin-top: 10px;">${errorMessage}</pre>`);
                stopPolling("Error during status check. Polling stopped.");
            }
        });
    };

    // Run immediately, then every 20 seconds
    checkStatus(); // Initial check
    statusCheckInterval = setInterval(checkStatus, 20000); // Poll every 20 seconds
}


$('#sendPayment').click(function () {
  const dummyData = {
    app: "diamond-ebilling",
    app_key: "diamond",
    app_url: "https://www.ibsbill.org/bill/callback/",
    amount: 0.10,
    username: "john_doe",
    token: "abc123token",
    momo_number: "233241995223", // Ensure this is a valid test number for your MoMo environment
    device_id: "MTR-001234",
  };

  // Clear previous responses and stop any existing polling
  $('#response').empty();
  $('#statusCheckResponse').empty();
  $('#pollingStatus').empty();
  stopPolling(); // Ensure any previous interval is cleared

  $('#response').html('<div class="alert alert-info">Sending payment request. Please wait<span class="blinking-dots"><span>.</span><span>.</span><span>.</span></span></div>');

  // --- First AJAX call: Send MoMo Payment Request ---
  $.ajax({
    url: "https://www.ibsbill.org/bill/", // Your Django endpoint for the initial payment request
    method: "POST",
    contentType: "application/json",
    data: JSON.stringify(dummyData),
    success: function (response) {
      // Commented out: $('#response').html(`<div class="alert alert-success">Initial Request Response: <pre>${JSON.stringify(response, null, 2)}</pre></div>`);
      $('#response').html(`<div class="alert alert-success">Payment request initiated successfully!</div>`);


      // Ensure the structure exists and the initial request was successful
      if (response && response.momo_request && response.momo_request.success) {
        const referenceId = response.momo_request.reference_id;
        const apiToken = dummyData.token; // Use the same token sent initially

        // Get the initial payment status from the response
        const initialPaymentStatus = response.momo_status_check?.payment_status;

        if (referenceId && apiToken) {
            // Commented out: $('#pollingStatus').html('<div class="alert alert-info">Initial MoMo request accepted. Preparing to check status...</div>');

            if (initialPaymentStatus === "PENDING") {
                $('#statusCheckResponse').html('<div class="alert alert-warning">Waiting for approval<span class="blinking-dots"><span>.</span><span>.</span><span>.</span></span></div>');
                $('#pollingStatus').html('<div class="alert alert-info">Transaction is PENDING. Starting automatic status checks.</div>');
                startPolling(referenceId, apiToken); // Start polling
            } else if (initialPaymentStatus === "SUCCESSFUL") {
                $('#statusCheckResponse').html(`<div class="alert alert-success">Transaction Completed Successfully!</div>`);
                // $('#pollingStatus').html('<div class="alert alert-success">Transaction was already successful. No polling needed.</div>');
            } else if (initialPaymentStatus === "FAILED") {
                $('#statusCheckResponse').html(`<div class="alert alert-danger">Transaction Failed.</div>`);
                $('#pollingStatus').html('<div class="alert alert-danger">Transaction already failed. No polling needed.</div>');
            } else {
                 $('#statusCheckResponse').html(`<div class="alert alert-warning">Transaction status is unknown. Please contact support.</div>`);
                 $('#pollingStatus').html('<div class="alert alert-info">Initial status not clear. No polling started.</div>');
            }

        } else {
          $('#statusCheckResponse').html('<div class="alert alert-warning">Could not retrieve transaction details to check status. Please try again.</div>');
          $('#pollingStatus').empty(); // Clear polling message
        }
      } else {
        // If the initial MoMo request was not successful (e.g., MoMo API error or bad request)
        $('#response').html(`<div class="alert alert-danger">Payment request could not be initiated. Please check your details and try again.</div>`);
        $('#statusCheckResponse').empty();
        $('#pollingStatus').empty(); // Clear polling message
      }
    },
    error: function (xhr) {
      // let message = xhr.responseText || "Unknown error during initial request"; // Commented out raw message
      $('#response').html(`<div class="alert alert-danger">Error: Could not initiate payment request. Please try again later.</div>`);
      $('#statusCheckResponse').empty();
      $('#pollingStatus').empty(); // Clear polling message
      stopPolling(); // Ensure polling is stopped if there was an initial error
    }
  });
});
</script>
</body>
</html>
